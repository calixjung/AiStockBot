  byId("historical-notes").textContent = basis + dataNote + " · 평가 " + windows.toLocaleString("ko-KR") + "개 · 거래량 3배 통과 " + relative_volume_pass + "개 · 매수 압력 통과 " + pressure_pass + "개 · 시장·소셜 필터 미적용";
  if (relative_volume_pass > 0) {
    byId("historical-notes").textContent += " · 거래량 통과 구간 중 매수 주도 70% 이상 " +
      buy_share_among_volume_pass + "개, 중간 호가 범위 0.5% 이하 " + tight_mid_among_volume_pass + "개";
  }
  byId("strategy").replaceChildren(...summary.map(result=>{
    const option = element("option",names[result.variant]);
    option.value = result.variant;
    return option;
  }));
  rows("historical-summary",summary.map(result=>[names[result.variant],result.fills?usd.format(result.net_pnl):"—",result.fills?result.max_drawdown_pct.toFixed(3)+"%":"—",result.fills+"건"]),4,"결과 없음");
  byId("saved").hidden = true;
  document.querySelector("nav a[href=\"#saved\"]")?.remove();
}
byId("strategy").addEventListener("change",render);
byId("side").addEventListener("change",render);
byId("platform").addEventListener("change",renderFeed);
render();
renderFeed();
</script>
</body>
</html>
