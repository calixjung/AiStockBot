  if (orb_selections) byId("historical-notes").textContent += " · ORB 후보(개장 5분 상대 거래량 상위 3, 양봉) " +
    orb_selections.reduce((total,item)=>total+item.symbols.length,0) + "건 / " + orb_selections.length + "일";
  if (summary[0].fills && marketDates.length) byId("historical-notes").textContent += " · 시장 거부권으로 피한 손실 " + usd.format(market_avoided_loss) + ", 놓친 수익 " + usd.format(market_missed_profit);
  if (orb_market_avoided_loss != null && summary.some(result=>result.variant==="orb" && result.fills)) byId("historical-notes").textContent += " · ORB에서 시장 거부권으로 피한 손실 " + usd.format(orb_market_avoided_loss) + ", 놓친 수익 " + usd.format(orb_market_missed_profit);
  if (evaluation) {
    const pct = value => value == null ? "—" : (value / 100).toFixed(2) + "%";
    const runs = random_baseline?.runs ?? 0;
    byId("evaluation-notes").textContent = "수익률은 매수 금액 대비, 호가 차이·수수료 포함. t값이 2 안팎을 넘어야 운이 아닐 가능성을 따져볼 만합니다. " +
      (split_date ? "앞 기간은 " + split_date + " 이전, 뒤 기간은 그날부터입니다. " : "") +
      (runs ? "무작위 진입 " + runs + "회(같은 비용·청산 규칙)의 거래당 평균은 중앙값 " + pct(random_baseline.mean_bp_p50) +
        ", 하위 5% " + pct(random_baseline.mean_bp_p05) + ", 상위 5% " + pct(random_baseline.mean_bp_p95) + "입니다." : "");
    rows("evaluation-rows", summary.map(result => {
      const stats = evaluation[result.variant] ?? {trades:0};
      const share = stats.random_share_at_least_as_good;
      return [names[result.variant], stats.trades + "건", stats.trades ? stats.win_rate_pct + "%" : "—", pct(stats.mean_bp),
        stats.t_stat ?? "—", pct(stats.early?.mean_bp), pct(stats.late?.mean_bp), share == null ? "—" : Math.round(share * 100) + "%"];
    }), 8, "결과 없음");
  }
  rows("historical-summary",summary.map(result=>[names[result.variant],result.fills?usd.format(result.net_pnl):"—",result.fills?result.max_drawdown_pct.toFixed(3)+"%":"—",result.fills+"건"]),4,"결과 없음");
  byId("saved").hidden = true;
  document.querySelector("nav a[href=\"#saved\"]")?.remove();
}
byId("strategy").addEventListener("change",render);
byId("side").addEventListener("change",render);
byId("platform").addEventListener("change",renderFeed);
render();
renderFeed();
</script>
</body>
</html>
